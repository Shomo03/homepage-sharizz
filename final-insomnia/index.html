<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <video class="back-vid" autoplay loop muted playsinline src="assets/galaxy.mp4"></video>
        <div class="cover"></div>

        <section class="hero" id="hero">
            <h2 class="title">
                <span>I</span>
                <span>N</span>
                <span>S</span>
                <span>O</span>
                <span>M</span>
                <span>N</span>
                <span>I</span>
                <span>A</span>
            </h2>
        </section>

        <section class="fog" id="fog">
            <div class="fog-info reveal soft-zoom">
                <p>
                    This website is a quiet, dream-like space that you move through.
                    It starts with a thought, then leads into a floating character
                    and ends with slow, blinking eyes, like drifting into sleep.
                </p>
            </div>

                <img class="weirdo reveal soft-zoom" src="assets/tro.png" alt="weird monster">
            
        </section>

        <section class="monster-wrap">
            <a href="orange-eyes.html" class="monster-holder reveal-monster monster-one">
                <img class="monster orange-monster" src="assets/orangy.png" alt="orange monster">
            </a>

            <a href="red-eyes.html" class="monster-holder reveal-monster monster-two">
                <img class="monster red-monster" src="assets/red.png" alt="red monster">
            </a>

            <a href="blue-eyes.html" class="monster-holder reveal-monster monster-three">
                <img class="monster blue-monster" src="assets/bluey.png" alt="blue monster">
            </a>
        </section>
    </div>

    <script src="main.js"></script>
</body>
</html>
